
<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152b">
  <title>Swar Sadhika AI — Device Feasibility</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #17152b;
      color: #f7f4ff;
    }
    body { max-width: 760px; margin: auto; padding: 22px 16px 40px; }
    .panel { background: #211e39; border: 1px solid #51476d;
      border-radius: 14px; padding: 16px; margin: 14px 0; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px;
      background: #d8b4fe; color: #21152e; font-weight: 700; font-size: 1rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    .note { color: #d0c9e2; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>स्वर साधिका AI</h1>
  <p class="note">Android और WebGPU संसाधन-जाँच</p>

  <section class="panel">
    <h2>परीक्षण रिपोर्ट</h2>
    <pre id="report">परीक्षण शुरू करने के लिए बटन दबाएँ।</pre>
  </section>

  <button id="run">डिवाइस की जाँच करें</button>

  <section class="panel">
    <h2>सीमा</h2>
    <p class="note">
      यह जाँच ब्राउज़र और GPU की रिपोर्ट देती है।
      यह उपलब्ध RAM का सटीक माप नहीं करती और न ही AI गायन मॉडल
      की अनुकूलता या गायन की गुणवत्ता प्रमाणित करती है।
    </p>
  </section>

<script>
const report = document.getElementById("report");
const button = document.getElementById("run");

async function runCheck() {
  button.disabled = true;
  report.textContent = "जाँच चल रही है…";

  const lines = [];
  const add = (label, value) => lines.push(label + ": " + value);

  try {
    add("ब्राउज़र", navigator.userAgent);
    add("ऑनलाइन स्थिति", navigator.onLine ? "ऑनलाइन" : "ऑफलाइन");
    add("हार्डवेयर concurrency", navigator.hardwareConcurrency ?? "उपलब्ध नहीं");
    add("deviceMemory अनुमान (GB)", navigator.deviceMemory ?? "ब्राउज़र ने उपलब्ध नहीं कराया");
    add("WebAssembly", typeof WebAssembly !== "undefined" ? "उपलब्ध" : "अनुपलब्ध");
    add("WebGPU API", navigator.gpu ? "उपलब्ध" : "अनुपलब्ध");

    if (navigator.storage?.estimate) {
      try {
        const storage = await navigator.storage.estimate();
        add("वेबसाइट के लिए अनुमानित उपयोग", storage.usage == null
          ? "उपलब्ध नहीं" : (storage.usage / 1e9).toFixed(2) + " GB");
        add("वेबसाइट के लिए अनुमानित quota", storage.quota == null
          ? "उपलब्ध नहीं" : (storage.quota / 1e9).toFixed(2) + " GB");
      } catch (e) {
        add("Storage estimate", "नहीं मिल सका: " + e.message);
      }
    } else {
      add("Storage estimate", "ब्राउज़र API उपलब्ध नहीं");
    }

    if (navigator.gpu) {
      try {
        const adapter = await navigator.gpu.requestAdapter();

        if (!adapter) {
          add("GPU adapter", "नहीं मिला");
        } else {
          add("GPU adapter", "मिला");

          try {
            const info = adapter.info;
            if (info) {
              add("GPU vendor", info.vendor || "अज्ञात");
              add("GPU architecture", info.architecture || "अज्ञात");
              add("GPU device", info.device || "अज्ञात");
              add("GPU description", info.description || "अज्ञात");
            }
          } catch (_) {
            add("GPU जानकारी", "ब्राउज़र ने छिपाई है");
          }

          const limits = adapter.limits;
          add("maxBufferSize", limits.maxBufferSize ?? "उपलब्ध नहीं");
          add("maxStorageBufferBindingSize",
            limits.maxStorageBufferBindingSize ?? "उपलब्ध नहीं");
          add("maxComputeWorkgroupStorageSize",
            limits.maxComputeWorkgroupStorageSize ?? "उपलब्ध नहीं");

          try {
            const device = await adapter.requestDevice();
            add("GPU device creation", "सफल");
            add("Device maxBufferSize", device.limits.maxBufferSize);
            add("Device maxStorageBufferBindingSize",
              device.limits.maxStorageBufferBindingSize);
            device.destroy();
          } catch (e) {
            add("GPU device creation", "विफल: " + e.message);
          }
        }
      } catch (e) {
        add("WebGPU परीक्षण", "विफल: " + e.message);
      }
    }

    add("अंतिम निष्कर्ष",
      "यह संसाधन रिपोर्ट है, AI singing model का परीक्षण नहीं।");
    report.textContent = lines.join("\n");
  } catch (e) {
    report.textContent = lines.join("\n") + "\nत्रुटि: " + e.message;
  } finally {
    button.disabled = false;
  }
}

button.addEventListener("click", runCheck);
</script>
</body>
</html>
